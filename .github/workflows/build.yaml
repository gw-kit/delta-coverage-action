name: 🔨 Build

on:
  push:
    branches:
      - 'develop'
      - 'main'
      - 'release/**'
  pull_request:
    branches:
      - '**'

jobs:

  build:
    name: 🔨 Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Tests
        run: npm test

      - name: 🔨 Build
        run: npm run build

      - name: 📈 Publish Delta Coverage
        id: render-delta-coverage
        uses: ./
        with:
          summary-report-base-path: 'test/data/'
          suppress-check-failures: true

      - name: 📤 Upload Badges
        id: upload-badges
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gen.svg
          path: ${{ steps.render-delta-coverage.outputs.badges-dir }}
